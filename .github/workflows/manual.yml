name: Manual

on: workflow_dispatch

concurrency:
  group: manual-${{ github.ref }}
  cancel-in-progress: true

permissions: {
  contents: read,
  actions: write
}

jobs:
  ci:
    name: ci
    uses: soltiHQ/actions/.github/workflows/rust-ci.yml@v1

  docs:
    name: docs
    uses: soltiHQ/actions/.github/workflows/docs-ci.yml@v1
